# =====================================================
# JOB ASSISTANT V2 CONFIGURATION
# =====================================================

application:
  name: "Job Assistant V2"
  version: "2.0.0"

# =====================================================
# RESUME SETTINGS
# =====================================================

resume:
  path: "resume/Parameshwari_New.pdf"

# =====================================================
# DATABASE SETTINGS
# =====================================================

database:
  type: "sqlite"
  path: "data/jobs.db"

# =====================================================
# EXCEL EXPORT SETTINGS
# =====================================================

excel:
  enabled: true
  path: "data/jobs.xlsx"

# =====================================================
# LOGGING SETTINGS
# =====================================================

logging:
  enabled: true
  level: "INFO"
  path: "logs/app.log"

# =====================================================
# ATS SETTINGS
# =====================================================

ats:
  minimum_score: 30
  save_below_threshold: false

# =====================================================
# JOB FILTER SETTINGS
# =====================================================

filters:

  roles:
    - "Cloud Engineer"
    - "DevOps Engineer"
    - "AWS Engineer"
    - "AWS DevOps Engineer"
    - "Linux Administrator"
    - "Platform Engineer"
    - "Site Reliability Engineer"
    - "Infrastructure Engineer"
    - "Cloud Support Engineer"

  locations:
    - "Chennai"
    - "Bengaluru"
    - "Hyderabad"
    - "Coimbatore"
    - "Remote"

  experience:
    min_years: 0
    max_years: 2

# =====================================================
# APPROVAL SETTINGS
# =====================================================

approval:

  enabled: true

  default_status: "PENDING"

  allow_open_job_link: true

# =====================================================
# JOB SOURCE SETTINGS
# =====================================================

job_sources:

  remotive:
    enabled: true
    limit: 50

  greenhouse:
    enabled: true
    limit: 50

  lever:
    enabled: true
    limit: 50

# =====================================================
# DUPLICATE DETECTION
# =====================================================

duplicates:

  enabled: true

  compare_fields:
    - company
    - role

# =====================================================
# STARTUP SETTINGS
# =====================================================

startup:

  run_on_windows_login: false

  ask_for_confirmation: true

# =====================================================
# EXPORT SETTINGS
# =====================================================

export:

  include_skills: true

  include_ats_score: true

  include_job_link: true

  include_platform: true

# =====================================================
# FUTURE FEATURES
# =====================================================

future:

  email_notifications: True

  dashboard_enabled: false

  ai_resume_optimizer: false

  auto_resume_customization: false
